<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraBattle Title Composition</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #000000;
        color: #f6f1e7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
      }

      [data-composition-id="terrabattle-title"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        isolation: isolate;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.78)),
          url("../src/assets/background/Title.webp") center / cover no-repeat,
          #000000;
      }

      .scene::before {
        position: absolute;
        inset: 0;
        z-index: 1;
        content: "";
        background:
          radial-gradient(circle at 50% 45%, rgba(216, 182, 111, 0.26), transparent 28%),
          radial-gradient(circle at 50% 82%, rgba(168, 59, 45, 0.42), transparent 34%),
          linear-gradient(90deg, rgba(0, 0, 0, 0.86), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.86));
      }

      .scene::after {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        content: "";
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.14), transparent 44%, rgba(0, 0, 0, 0.64));
      }

      .scene-content {
        position: relative;
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 116px 160px 128px;
        gap: 34px;
        text-align: center;
      }

      .battle-lines {
        position: absolute;
        inset: 110px 170px;
        z-index: 2;
        opacity: 0.62;
        background:
          linear-gradient(rgba(217, 182, 111, 0.22) 1px, transparent 1px),
          linear-gradient(90deg, rgba(217, 182, 111, 0.2) 1px, transparent 1px);
        background-size: 96px 96px;
        mask-image: radial-gradient(circle at center, black 0 42%, transparent 74%);
        will-change: transform, opacity;
      }

      .battle-lines--diagonal {
        transform: rotate(-22deg) scale(1.35);
        opacity: 0.28;
      }

      .crest {
        width: 132px;
        height: 132px;
        border: 2px solid rgba(246, 241, 231, 0.76);
        transform: rotate(45deg);
        background:
          linear-gradient(135deg, rgba(217, 182, 111, 0.58), rgba(168, 59, 45, 0.2)),
          rgba(0, 0, 0, 0.38);
        box-shadow:
          0 0 32px rgba(217, 182, 111, 0.36),
          inset 0 0 38px rgba(0, 0, 0, 0.66);
        will-change: transform, opacity;
      }

      .crest::before,
      .crest::after {
        position: absolute;
        inset: 24px;
        content: "";
        border: 1px solid rgba(246, 241, 231, 0.54);
      }

      .crest::after {
        inset: 46px;
        background: rgba(246, 241, 231, 0.82);
      }

      .title-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        will-change: transform, opacity;
      }

      .eyebrow {
        color: #d9b66f;
        font-size: 30px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.92);
      }

      .title {
        margin: 0;
        color: #f6f1e7;
        font-size: 154px;
        font-weight: 950;
        line-height: 0.88;
        letter-spacing: 0;
        text-shadow:
          0 8px 18px rgba(0, 0, 0, 0.95),
          0 0 28px rgba(217, 182, 111, 0.46),
          0 0 72px rgba(168, 59, 45, 0.36);
      }

      .title span {
        display: inline-block;
        will-change: transform, opacity;
      }

      .rule {
        width: min(940px, 76%);
        height: 3px;
        background: linear-gradient(90deg, transparent, #d9b66f, #f6f1e7, #d9b66f, transparent);
        box-shadow: 0 0 18px rgba(217, 182, 111, 0.54);
        transform-origin: center;
        will-change: transform, opacity;
      }

      .tagline {
        width: min(820px, 82%);
        margin: 0;
        color: rgba(246, 241, 231, 0.86);
        font-size: 32px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: 0;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95);
        will-change: transform, opacity;
      }

      .ember-field {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }

      .ember {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #d9b66f;
        box-shadow: 0 0 16px rgba(217, 182, 111, 0.78);
        opacity: 0.72;
        will-change: transform, opacity;
      }

      .ember:nth-child(1) {
        left: 18%;
        top: 74%;
      }

      .ember:nth-child(2) {
        left: 29%;
        top: 66%;
      }

      .ember:nth-child(3) {
        left: 44%;
        top: 79%;
      }

      .ember:nth-child(4) {
        left: 63%;
        top: 70%;
      }

      .ember:nth-child(5) {
        left: 77%;
        top: 76%;
      }

      .ember:nth-child(6) {
        left: 84%;
        top: 62%;
      }

      .vignette {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        box-shadow: inset 0 0 210px rgba(0, 0, 0, 0.92);
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="terrabattle-title"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
      data-track-index="0"
    >
      <main class="scene" aria-label="TerraBattle title animation">
        <div class="battle-lines"></div>
        <div class="battle-lines battle-lines--diagonal"></div>
        <div class="ember-field" aria-hidden="true">
          <span class="ember"></span>
          <span class="ember"></span>
          <span class="ember"></span>
          <span class="ember"></span>
          <span class="ember"></span>
          <span class="ember"></span>
        </div>
        <section class="scene-content">
          <div class="crest" aria-hidden="true"></div>
          <div class="title-wrap">
            <p class="eyebrow">TACTICAL FIELD INITIATED</p>
            <h1 class="title" aria-label="TERRABATTLE">
              <span>T</span><span>E</span><span>R</span><span>R</span><span>A</span><span>B</span><span>A</span><span>T</span><span>T</span><span>L</span><span>E</span>
            </h1>
            <div class="rule" aria-hidden="true"></div>
            <p class="tagline">Command the ground. Break the enemy line.</p>
          </div>
        </section>
        <div class="vignette"></div>
      </main>
      <script>
        window.__timelines = window.__timelines || {};

        const tl = gsap.timeline({
          paused: true,
          defaults: { ease: "power3.out" },
        });

        tl.addLabel("opening", 0)
          .from(".scene", { scale: 1.08, opacity: 0, duration: 1.1 }, "opening")
          .from(".battle-lines", { opacity: 0, scale: 0.88, duration: 1.4, stagger: 0.16 }, "opening+=0.18")
          .from(".crest", { opacity: 0, scale: 0.42, rotation: -45, duration: 0.9, ease: "back.out(1.8)" }, "opening+=0.56")
          .from(".eyebrow", { y: 28, opacity: 0, duration: 0.56 }, "opening+=0.96")
          .from(".title span", { y: 86, opacity: 0, scale: 0.82, duration: 0.72, stagger: 0.055, ease: "back.out(1.45)" }, "opening+=1.18")
          .from(".rule", { scaleX: 0, opacity: 0, duration: 0.62 }, "opening+=1.92")
          .from(".tagline", { y: 34, opacity: 0, duration: 0.62 }, "opening+=2.16")
          .fromTo(".ember", { y: 160, opacity: 0 }, { y: -170, opacity: 0.86, duration: 3.1, stagger: 0.18, ease: "sine.out" }, "opening+=2.3")
          .to(".battle-lines", { x: 34, y: -22, duration: 5.2, ease: "none" }, "opening+=2.7")
          .to(".title-wrap", { scale: 1.035, duration: 4.2, ease: "sine.inOut" }, "opening+=3.0")
          .to(".crest", { rotation: 45, scale: 1.08, duration: 4.0, ease: "sine.inOut" }, "opening+=3.0")
          .addLabel("outro", 8.2)
          .to(".tagline", { y: -24, opacity: 0, duration: 0.42, ease: "power2.in" }, "outro")
          .to(".rule", { scaleX: 0, opacity: 0, duration: 0.42, ease: "power2.in" }, "outro+=0.08")
          .to(".title span", { y: -76, opacity: 0, duration: 0.48, stagger: { amount: 0.28, from: "center" }, ease: "power2.in" }, "outro+=0.22")
          .to(".eyebrow", { y: -22, opacity: 0, duration: 0.36, ease: "power2.in" }, "outro+=0.58")
          .to(".crest", { opacity: 0, scale: 0.7, duration: 0.46, ease: "power2.in" }, "outro+=0.66")
          .to(".scene", { opacity: 0, scale: 1.12, duration: 0.74, ease: "power2.in" }, 9.18);

        window.__timelines["terrabattle-title"] = tl;
      </script>
    </div>
  </body>
</html>
